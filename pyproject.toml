[project]
license = "Apache-2.0"
name = "training-data-generator"
version = "0.1.0"
description = "Generates MLX-compatible training JSONL files from validated inference samples and uploads to MinIO"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "aioboto3>=13.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15",
    "ty>=0.0.23",
    "detect-secrets>=1.5.0",
    "pytest-timeout>=2.3.1",
    "pip-audit>=2.10.0",
    "bandit>=1.8.0",
    "isort>=5.13.0",
    "vulture>=2.14",
    # pip-audit -> pip-api -> pip: floor past PYSEC-2026-3721 (fixed in pip 26.2)
    "pip>=26.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]
known_first_party = ["models", "routers", "services", "logging_config", "settings", "telemetry", "db", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ty.environment]
python-version = "3.14"
python = ".venv"
extra-paths = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
timeout = 180
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow-running",
]

[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = []
